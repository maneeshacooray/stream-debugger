[package]
name = "tauri-app"
version = "0.1.0"
description = "A Tauri App"
authors = ["you"]
edition = "2021"

# See more keys and their definitions at https://doc.rust-lang.org/cargo/reference/manifest.html

[lib]
# The `_lib` suffix may seem redundant but it is necessary
# to make the lib name unique and wouldn't conflict with the bin name.
# This seems to be only an issue on Windows, see https://github.com/rust-lang/cargo/issues/8519
name = "tauri_app_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
tauri-plugin-opener = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
onvif-discover = { version = "0.1.0", path = "../../84-horcery-ip-cam-discovery-rust/onvif-discover" }
tokio = { version = "1.50.0", features = ["full"] }
onvif = { git = "https://github.com/lumeohq/onvif-rs.git", rev = "8f1490e", version = "0.1.0" }
media = { git = "https://github.com/lumeohq/onvif-rs.git", rev = "8f1490e", version = "0.1.0" }
ptz = { git = "https://github.com/lumeohq/onvif-rs.git", rev = "8f1490e", version = "0.1.0" }
futures-util = "0.3.32"
schema = { git = "https://github.com/lumeohq/onvif-rs.git", rev = "8f1490e" }
url = "2"
reqwest = { version = "0.13.2", features = ["json", "blocking"] }
base64 = "0.22.1"

