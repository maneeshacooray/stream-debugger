# Build and release when merging to main.
# Requires: GitHub repo secret EXPO_TOKEN (Expo dashboard → Account → Access tokens).
# Bump version in package.json before merging to main to avoid duplicate release tags.

name: Build and Release

on:
  push:
    branches: [main]
    paths-ignore:
      - "**/*.md"
      - "docs/**"

permissions:
  contents: write # create release and tag

jobs:
  build-and-release:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: "npm"

      - name: Install dependencies
        run: npm ci

      - name: Lint
        run: npm run lint

      - name: Get version
        id: version
        run: echo "VERSION=$(node -p "require('./package.json').version")" >> $GITHUB_OUTPUT

      - name: Check EXPO_TOKEN
        run: |
          if [ -z "${{ secrets.EXPO_TOKEN }}" ]; then
            echo "::error::EXPO_TOKEN secret is not set. Add it in repo Settings → Secrets and variables → Actions. Create a token at https://expo.dev/accounts/[username]/settings/access-tokens"
            exit 1
          fi

      - name: Setup EAS
        uses: expo/expo-github-action@v8
        with:
          eas-version: latest
          token: ${{ secrets.EXPO_TOKEN }}

      - name: EAS Build (Android APK)
        id: build
        run: |
          eas build --platform android --profile release-apk --non-interactive --wait --json > build.json
          cat build.json
        env:
          EXPO_TOKEN: ${{ secrets.EXPO_TOKEN }}

      - name: Get APK download URL
        id: artifact
        run: |
          APK_URL=""
          if [ -f build.json ]; then
            APK_URL=$(jq -r '.[0].artifacts.applicationArchiveUrl // .artifacts.applicationArchiveUrl // empty' build.json 2>/dev/null)
          fi

          if [ -z "$APK_URL" ] || [ "$APK_URL" = "null" ]; then
            echo "Parsing build.json failed or was empty. Trying fallback list query..."
            BUILD_JSON_LIST=$(eas build:list --platform android --status finished --limit 1 --build-profile release-apk --non-interactive --json 2>/dev/null || echo "[]")
            APK_URL=$(echo "$BUILD_JSON_LIST" | jq -r '.[0].artifacts.applicationArchiveUrl // empty')
          fi

          if [ -z "$APK_URL" ] || [ "$APK_URL" = "null" ]; then
            echo "Error: Could not retrieve APK download URL."
            exit 1
          fi

          echo "APK URL: $APK_URL"
          echo "url=$APK_URL" >> $GITHUB_OUTPUT
        env:
          EXPO_TOKEN: ${{ secrets.EXPO_TOKEN }}

      - name: Download APK
        run: |
          curl -L -f -o stream-debugger.apk \
            "${{ steps.artifact.outputs.url }}"
          ls -la stream-debugger.apk

      - name: Create GitHub Release
        id: release
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          VERSION: ${{ steps.version.outputs.VERSION }}
        run: |
          TAG="v${VERSION}"
          NOTES="Release ${TAG}

          **Android:** Download the APK from the Assets below."
          gh release create "$TAG" \
            --target ${{ github.sha }} \
            --title "$TAG" \
            --notes "$NOTES" \
            || echo "Release $TAG may already exist; continuing."

      - name: Upload APK to Release
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          VERSION: ${{ steps.version.outputs.VERSION }}
        run: |
          TAG="v${VERSION}"
          gh release upload "$TAG" stream-debugger.apk --clobber
