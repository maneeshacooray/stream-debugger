# Build and release when merging to main.
# Requires: GitHub repo secret EXPO_TOKEN (Expo dashboard → Account → Access tokens).
# Bump version in package.json before merging to main to avoid duplicate release tags.

name: Build and Release

on:
  push:
    branches: [main]

permissions:
  contents: write  # create release and tag

jobs:
  build-and-release:
    runs-on: ubuntu-latest
    # Use the environment where EXPO_TOKEN is stored (e.g. "production").
    # If EXPO_TOKEN is a repository secret (not under an environment), remove this line.
    environment: release
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: "npm"

      - name: Install dependencies
        run: npm ci

      - name: Lint
        run: npm run lint

      - name: Get version
        id: version
        run: echo "VERSION=$(node -p "require('./package.json').version")" >> $GITHUB_OUTPUT

      - name: Check EXPO_TOKEN
        run: |
          if [ -z "${{ secrets.EXPO_TOKEN }}" ]; then
            echo "::error::EXPO_TOKEN secret is not set. Add it in repo Settings → Secrets and variables → Actions. Create a token at https://expo.dev/accounts/[username]/settings/access-tokens"
            exit 1
          fi

      - name: Setup EAS
        uses: expo/expo-github-action@v8
        with:
          eas-version: latest
          token: ${{ secrets.EXPO_TOKEN }}

      - name: EAS Build (Android APK)
        id: build
        run: |
          eas build --platform android --profile release-apk --non-interactive --wait 2>&1 | tee build.log
        env:
          EXPO_TOKEN: ${{ secrets.EXPO_TOKEN }}

      - name: Get APK download URL
        id: artifact
        run: |
          BUILD_JSON=$(eas build:list --platform android --status finished --limit 1 --build-profile release-apk --git-commit-hash ${{ github.sha }} --non-interactive --json 2>/dev/null || echo "[]")
          APK_URL=$(echo "$BUILD_JSON" | jq -r '.[0].artifacts.applicationArchiveUrl // empty')
          if [ -z "$APK_URL" ]; then
            echo "Could not get APK URL from build list"
            exit 1
          fi
          echo "url=$APK_URL" >> $GITHUB_OUTPUT
        env:
          EXPO_TOKEN: ${{ secrets.EXPO_TOKEN }}

      - name: Download APK
        run: |
          curl -L -f -o stream-debugger.apk \
            -H "Authorization: Bearer $EXPO_TOKEN" \
            "${{ steps.artifact.outputs.url }}"
          ls -la stream-debugger.apk
        env:
          EXPO_TOKEN: ${{ secrets.EXPO_TOKEN }}

      - name: Create GitHub Release
        id: release
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          VERSION: ${{ steps.version.outputs.VERSION }}
        run: |
          TAG="v${VERSION}"
          NOTES="Release ${TAG}

          **Android:** Download the APK from the Assets below."
          gh release create "$TAG" \
            --target ${{ github.sha }} \
            --title "$TAG" \
            --notes "$NOTES" \
            || echo "Release $TAG may already exist; continuing."

      - name: Upload APK to Release
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          VERSION: ${{ steps.version.outputs.VERSION }}
        run: |
          TAG="v${VERSION}"
          gh release upload "$TAG" stream-debugger.apk --clobber
