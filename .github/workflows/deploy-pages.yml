# Build and deploy the static web export to GitHub Pages on every push to main.
# One-time manual step required: repo Settings -> Pages -> Source: "GitHub Actions".

name: Deploy Pages

on:
  push:
    branches: [main]
    paths-ignore:
      - "**/*.md"
      - "docs/**"

permissions:
  contents: read
  pages: write
  id-token: write

# Avoid two deploys racing; let the latest push win.
concurrency:
  group: "pages"
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: "npm"

      - name: Install dependencies
        run: npm ci

      - name: Export web build
        run: npx expo export -p web

      # GitHub Pages has no server-side rewrites, so a deep link (e.g. a
      # bookmarked or reloaded route) 404s unless we serve the SPA shell
      # for unknown paths too.
      - name: Add SPA fallback for client-side routing
        run: cp dist/index.html dist/404.html

      - name: Setup Pages
        uses: actions/configure-pages@v5

      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: dist

  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    needs: build
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
